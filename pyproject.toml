[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "webattackdetection"
version = "1.0.0"
description = "Web log detection lab for SQL injection, XSS, suspicious user agents, and risk summaries"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[project.scripts]
web-attack-detection = "dashboard.app:main"

[tool.setuptools]
py-modules = ["main"]

[tool.setuptools.packages.find]
include = ["dashboard*", "src*"]
